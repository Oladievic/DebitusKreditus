services:
  cabinet:
    build: .
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      DATABASE_PATH: /data/debitus-kreditus.sqlite
      NODE_ENV: production
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-0}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-http://127.0.0.1:11434}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen3:0.6b}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - cabinet-data:/data
    restart: unless-stopped
    init: true

volumes:
  cabinet-data:
